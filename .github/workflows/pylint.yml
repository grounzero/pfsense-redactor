name: Pylint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs when a new workflow run is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN: this workflow only checks out the code and
# runs a linter. Without an explicit block the token inherits the repository
# default, which can include write scopes.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
    - name: Analysing production code with pylint (strict)
      run: |
        pylint --rcfile=.pylintrc $(git ls-files 'pfsense_redactor/*.py')
    
    - name: Analysing test code with pylint (relaxed)
      run: |
        pylint --rcfile=.pylintrc-tests $(git ls-files 'tests/**/*.py')
