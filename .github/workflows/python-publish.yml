# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]

# Prevent multiple publish jobs from running simultaneously
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Publishing authenticates with PyPI through OIDC Trusted Publishing and
# nothing else. There is no `password:` input and no API-token fallback, and
# none should be added: a long-lived token is a credential that exists between
# releases, is exposed to every workflow running in the trusted context, and
# cannot be scoped to a single publish. The `id-token: write` permission on the
# pypi-publish job below is what makes the exchange work, and it is granted on
# that job alone rather than at the top of the file.
#
# A dormant PYPI_API_TOKEN repository secret was configured at the time of the
# July 2026 review, referenced by no workflow. Revoking it on PyPI and deleting
# the repository secret is a repository-settings action that cannot be made
# from a pull request; see docs/security-remediation-tracker.md.

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.x"
          cache: 'pip'

      - name: Build release distributions
        run: |
          # NOTE: put your own distribution build steps here.
          python -m pip install build
          python -m build

      - name: Upload distributions
        # v7.0.0
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      url: https://pypi.org/project/pfsense-redactor/${{ github.event.release.tag_name }}

    steps:
      - name: Retrieve release distributions
        # v8.0.0
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        # v1.14.1
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247
        with:
          packages-dir: dist/
