name: Update Reference Snapshots

# Regenerates tests/reference/*.xml and proposes them as a pull request.
#
# This is the only workflow that can write to the repository, which makes it
# the one whose supply chain matters most. Two things follow from that:
#
#   1. No third-party action runs here. The previous version used
#      ad-m/github-push-action@master - a moving branch, in a job holding
#      contents: write and GITHUB_TOKEN - so whoever controlled that
#      repository's master branch could push arbitrary commits here on the next
#      dispatch. It has been replaced with `git push`, which needs no third
#      party at all. The two GitHub-owned actions that remain are pinned to
#      immutable commit SHAs.
#
#   2. Snapshots are proposed, not committed. Regenerated snapshots become the
#      baseline every future comparison is measured against, so a leak baked
#      into them is a leak every later run then treats as correct. A pull
#      request puts a human between the regeneration and the baseline.
#
# The gates below run before anything is committed. They exist because a
# snapshot update is exactly the operation that can silently approve a leak:
# the output changed, the reference changed to match, and nothing objected.

on:
  workflow_dispatch:  # Manual trigger only

permissions:
  contents: read

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to push the branch
      pull-requests: write   # to open the PR

    steps:
    - name: Checkout code
      # v7.0.1
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Python 3.9
      # v7.0.0
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e .

    - name: Run the full suite before regenerating anything
      # A snapshot regenerated from a broken build is a broken baseline.
      run: python -m pytest tests/ -q

    - name: Update reference snapshots
      run: |
        cd tests
        UPDATE_REFERENCE=1 pytest integration/test_reference_snapshots.py -v

    - name: Show what changed
      run: git --no-pager diff --stat -- tests/reference/

    - name: Assert no private-key material in the regenerated snapshots
      run: |
        if grep -rlE -- '-----BEGIN [A-Z0-9 ]*PRIVATE KEY' tests/reference/; then
          echo "::error::A regenerated snapshot contains private-key material."
          exit 1
        fi
        echo "No private-key marker in tests/reference/."

    - name: Decode-aware canary scan of the regenerated snapshots
      # Follows base64 layers, so a marker the corpus author encoded cannot
      # pass by being unreadable to a literal grep.
      run: |
        cat tests/reference/*/*.xml \
          | python tests/adversarial/decode_scan.py

    - name: Verify the snapshots with the independent verifier
      # The same check the tool applies to its own output, applied to the
      # baseline that check will be measured against.
      run: |
        python - <<'PY'
        import sys
        from pathlib import Path
        from pfsense_redactor import verifier

        failures = 0
        for path in sorted(Path('tests/reference').glob('*/*.xml')):
            result = verifier.scan_shapes(path.read_text(encoding='utf-8'))
            if not result.clean:
                failures += 1
                print(f"::error file={path}::{'; '.join(verifier.describe(result))}")

        if failures:
            sys.exit(f"{failures} snapshot(s) failed independent verification")
        print("All snapshots verified clean.")
        PY

    - name: Re-run the full suite against the new snapshots
      run: python -m pytest tests/ -q

    - name: Open a pull request with the updated snapshots
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        if git diff --quiet -- tests/reference/; then
          echo "Snapshots are already up to date; nothing to propose."
          exit 0
        fi

        branch="chore/update-snapshots-${GITHUB_RUN_ID}"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git checkout -b "$branch"
        git add tests/reference/
        git commit -m "Update reference snapshots for Python 3.9+"
        git push origin "$branch"

        gh pr create \
          --base "${GITHUB_REF_NAME}" \
          --head "$branch" \
          --title "Update reference snapshots" \
          --body "Regenerated by the update-snapshots workflow (run ${GITHUB_RUN_ID}).

        Gates that passed before this was proposed:

        - full test suite, before and after regeneration
        - no private-key marker in any snapshot
        - decode-aware canary scan
        - independent verifier over every snapshot

        Review the diff before merging: these files become the baseline every
        future comparison is measured against."
